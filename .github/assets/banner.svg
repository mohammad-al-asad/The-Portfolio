<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="text" gradientUnits="userSpaceOnUse" x1="420" y1="0" x2="640" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#9333ea"/></linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9333ea" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="#0b0b10"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <circle cx="1040" cy="60" r="260" fill="url(#glowPurple)"/>
    <circle cx="180" cy="300" r="240" fill="url(#glowBlue)"/>

    <!-- orbit, echoing the hero photo ring -->
    <g transform="translate(1060 160)" fill="none">
      <circle r="112" stroke="#60a5fa" stroke-opacity="0.18" stroke-width="2"/>
      <circle r="88" stroke="#a855f7" stroke-opacity="0.22" stroke-width="2"/>
      <circle r="64" stroke="url(#ring)" stroke-width="3"/>
      <circle cx="79" cy="-79" r="11" fill="#3b82f6" stroke="none"/>
      <circle cx="-79" cy="79" r="7" fill="#a855f7" stroke="none"/>
      <text y="12" text-anchor="middle" fill="#ffffff" stroke="none"
            font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800">MA</text>
    </g>

    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="80" y="96" fill="#94a3b8" font-size="18" font-weight="600" letter-spacing="4">PORTFOLIO</text>
      <text x="80" y="160" fill="#ffffff" font-size="58" font-weight="800">Mohammad <tspan fill="url(#text)">Al Asad</tspan></text>
      <text x="80" y="206" fill="#cbd5e1" font-size="24">Full-stack &amp; React Native developer</text>
      <text x="80" y="258" fill="#60a5fa" font-size="18" font-weight="600">mohammad-al-asad.vercel.app  →</text>
    </g>
  </g>
</svg>
